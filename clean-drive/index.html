<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183f35">
<meta name="description" content="Чистый драйв — короткая браузерная игра Чистых Игр. Сортируй, собирай серии и возвращай природе цвет.">
<title>Чистый драйв — Чистые Игры</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:#183f35;color:#f6f7ee;font:17px/1.6 system-ui;text-align:center;padding:20px;box-sizing:border-box}h1{font-size:30px}button{font:inherit;padding:12px 20px;border:0;border-radius:14px;background:#d9f47a;color:#183f35}</style>
</head>
<body>
<main><h1>Чистый драйв</h1><p id="loading" role="status">Запускаем игру…</p><noscript>Для игры нужно включить JavaScript.</noscript></main>
<script>
(async()=>{
  try {
    if(!('DecompressionStream' in window)) throw new Error('Откройте игру в обновленном Safari или Chrome.');
    const response=await fetch('./game.pack?v=f88a195d');
    if(!response.ok) throw new Error('Не удалось загрузить игру. Проверьте интернет и обновите страницу.');
    const pack=await response.text();
    const match=pack.match(/<script id="game-data"[^>]*>([\s\S]*?)<\/script>/);
    if(!match) throw new Error('Файл игры недоступен. Обновите страницу.');
    let encoded=match[1].replace(/\s/g,'');
    // Restore the exact transport bytes; gzip CRC and SHA-256 validate the full game.
    const repairs=[[13998,14000,'zL',''],[13628,13629,'m','2'],[13557,13559,'SP','PS']];
    for(const [start,end,oldValue,newValue] of repairs){
      if(encoded.slice(start,end)!==oldValue) throw new Error('Версия игры обновилась. Обновите страницу.');
      encoded=encoded.slice(0,start)+newValue+encoded.slice(end);
    }
    const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const unpacked=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    if(unpacked.byteLength!==89581) throw new Error('Игра загрузилась не полностью. Обновите страницу.');
    if(window.crypto && window.crypto.subtle){
      const digest=await crypto.subtle.digest('SHA-256',unpacked);
      const actual=Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');
      if(actual!=='ee773e930a85c844e323f19bd3310f304095d2caf4365f746e5240cc81c5714c') throw new Error('Не удалось проверить файл игры. Обновите страницу.');
    }
    const html=new TextDecoder().decode(unpacked);
    document.open();document.write(html);document.close();
  } catch(error) {
    document.getElementById('loading').textContent=error.message || 'Не удалось запустить игру. Обновите страницу.';
    const button=document.createElement('button');button.textContent='Попробовать еще раз';button.onclick=()=>location.reload();document.querySelector('main').append(button);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Чайка vs Бутерброд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    background: #D1D3DE;
  }
  body { font-family: 'Patrick Hand', cursive; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 5;
  }
  .score {
    font-family: 'Caveat', cursive;
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 700; color: #2A2A2D;
    transform: rotate(-2deg);
    background: rgba(236, 232, 219, 0.85);
    padding: 2px 12px; border-radius: 2px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .lives {
    display: flex; gap: 6px;
    background: rgba(236, 232, 219, 0.85);
    padding: 6px 10px; border-radius: 2px;
    transform: rotate(2deg);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .heart { width: 28px; height: 28px; transition: transform 0.4s, opacity 0.4s; }
  .heart.lost { opacity: 0.18; transform: scale(0.7) rotate(20deg); }

  /* Bottom-right cycle button for sandwich style */
  .style-btn {
    position: fixed;
    right: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    background: rgba(236, 232, 219, 0.92);
    border: 1.5px solid #2A2A2D;
    border-radius: 22px;
    padding: 8px 14px;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 700;
    color: #2A2A2D;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    z-index: 6;
    transform: rotate(-1deg);
  }
  .style-btn:active { transform: rotate(-1deg) translate(2px, 2px); box-shadow: 0 0 0 rgba(0,0,0,0.15); }
  .style-btn .style-num { color: #5A5DAB; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(236, 232, 219, 0.95);
    text-align: center; padding: 24px; z-index: 10;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay h1 {
    font-family: 'Caveat', cursive;
    font-size: clamp(40px, 9vw, 68px);
    font-weight: 700; color: #2A2A2D;
    margin-bottom: 18px;
    transform: rotate(-2deg); line-height: 1;
  }
  .overlay p {
    font-size: clamp(18px, 4.5vw, 22px);
    color: #3F3F45; margin-bottom: 14px;
    max-width: 400px; line-height: 1.45;
  }

  /* Sandwich style picker on start screen */
  .picker {
    margin: 14px 0 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .picker .label {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: #555;
    margin-bottom: -4px;
  }
  .picker-row {
    display: flex; gap: 10px;
    background: #fff;
    border: 1.5px solid #2A2A2D;
    border-radius: 4px;
    padding: 10px;
    box-shadow: 3px 3px 0 #2A2A2D;
  }
  .picker-cell {
    width: 70px; height: 60px;
    border: 1px dashed transparent;
    border-radius: 3px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px;
    background: rgba(0,0,0,0.02);
  }
  .picker-cell.selected {
    border-color: #5A5DAB;
    background: rgba(90, 93, 171, 0.1);
  }
  .picker-cell canvas {
    width: 60px; height: 32px;
  }
  .picker-cell .num {
    font-family: 'Caveat', cursive;
    font-size: 14px;
    color: #555;
    margin-top: 2px;
    font-weight: 700;
  }
  .picker-cell.selected .num { color: #5A5DAB; }

  .credit {
    margin-top: 10px;
    font-size: clamp(14px, 3.5vw, 16px);
    color: #6A6A70; transform: rotate(-1deg);
  }
  .btn {
    font-family: 'Caveat', cursive;
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 700;
    background: #5A5DAB; color: #fff;
    border: 2px solid #2A2A2D;
    padding: 10px 36px; border-radius: 3px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #2A2A2D;
    transform: rotate(-1deg);
    transition: transform 0.12s, box-shadow 0.12s;
    pointer-events: auto;
  }
  .btn:active {
    transform: rotate(-1deg) translate(3px, 3px);
    box-shadow: 1px 1px 0 #2A2A2D;
  }
  .btn.secondary { background: #B5A852; }
  .hidden { display: none !important; }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #ECE8DB;
    font-family: 'Caveat', cursive;
    font-size: 32px;
    color: #2A2A2D;
    z-index: 20;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="score">Счёт: <span id="scoreVal">0</span></div>
  <div class="lives" id="lives"></div>
</div>

<button class="style-btn hidden" id="styleBtn" type="button">
  Стиль <span class="style-num" id="styleNum">1</span> ↻
</button>

<div class="loading" id="loading">Загружаем рисунок...</div>

<div class="overlay hidden" id="startScreen">
  <h1>Чайка vs Бутерброд</h1>
  <p>Парк 300-летия, набережная.<br>Ты сел перекусить, а чайки уже знают.<br>Тапай по чайкам — они улетят.</p>

  <div class="picker">
    <div class="label">Выбери стиль бутерброда:</div>
    <div class="picker-row" id="pickerRow"></div>
  </div>

  <button class="btn" id="startBtn">Поехали!</button>
  <div class="credit">по рисунку Льва</div>
</div>

<div class="overlay hidden" id="endScreen">
  <h1 id="endTitle">Чайки победили!</h1>
  <p id="endMsg">Бутерброд унесли...</p>
  <button class="btn secondary" id="restartBtn">Ещё разок</button>
</div>

  // Source bg dimensions: 1121 x 1743
  const SRC_W = 1121;
  const SRC_H = 1743;
  const OFFSET_Y = 920;
  const SRC = {
    sandwichCenter: { x: 727, y: 215 + OFFSET_Y },
    gullPerchCenter: { x: 885, y: 155 + OFFSET_Y },
    parapetTop: 215 + OFFSET_Y,

    // Areas of Lev's original sandwich and gull (to be masked over) — generous bbox
    levSandwichArea:  { x: 660, y: 158 + OFFSET_Y, w: 130, h: 75 },
    // Donor patch — clean parapet section to the left, well clear of sandwich
    levSandwichDonor: { x: 460, y: 158 + OFFSET_Y },

    levGullArea:      { x: 765, y: 80 + OFFSET_Y, w: 250, h: 155 },
    // Donor patch — clean sky+parapet section to the LEFT of Lev's sandwich,
    // safely between boy (ends x=425) and sandwich (starts x=695).
    // Donor end = 430 + 250 = 680 < 695, so won't capture sandwich
    levGullDonor:     { x: 430, y: 80 + OFFSET_Y },

    // Boy's head mask — 12px margin around sprite (280,65)–(425,185)
    boyHeadArea:      { x: 268, y: 53 + OFFSET_Y, w: 169, h: 144 },
    // Donor: clean sky between boy (right edge ~437) and sandwich (left edge ~660)
    boyHeadDonor:     { x: 480, y: 53 + OFFSET_Y },
    // Neck pivot: 85% from top of sprite (y=65 + 0.85*120=102 → y≈167)
    boyHeadCenter:    { x: 352, y: 167 + OFFSET_Y }
  };

  let bgScale = 1, bgOffsetX = 0, bgOffsetY = 0;
  let now = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (assets.bg) {
      const scaleX = W / SRC_W;
      const scaleY = H / SRC_H;
      bgScale = Math.max(scaleX, scaleY);
      const dispW = SRC_W * bgScale;
      const dispH = SRC_H * bgScale;
      bgOffsetX = (W - dispW) / 2;
      bgOffsetY = (H - dispH) / 2;
    }
    sandwichCache.lives = -1; // invalidate
    maskCache.clear();
  }

  function srcToCanvas(sx, sy) {
    return { x: sx * bgScale + bgOffsetX, y: sy * bgScale + bgOffsetY };
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  const state = {
    running: false, score: 0, lives: 3,
    gulls: [], crumbs: [], feathers: [],
    spawnTimer: 800, spawnInterval: 2200,
    timeAlive: 0, shake: 0, flash: 0,
    biteProgress: 0,
    sandwichStyle: 1 // 1..4
  };

  // ===== AUDIO =====
  let audioCtx;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }
  function beep(freq, dur, type='square', vol=0.07) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  }
  function gullCry() {
    beep(900 + Math.random() * 200, 0.08, 'sawtooth', 0.05);
    setTimeout(() => beep(700 + Math.random() * 150, 0.08, 'sawtooth', 0.04), 90);
  }
  function chompSound() {
    beep(160, 0.12, 'square', 0.06);
    setTimeout(() => beep(110, 0.1, 'square', 0.05), 80);
  }
  function whooshSound() { beep(400, 0.15, 'triangle', 0.04); }

  function jit(a) { return (Math.random() - 0.5) * a; }

  function gullDisplaySize() { return 120 * bgScale; }

  // ===== GULLS =====
  // Spawn types:
  //   'normal'  — flies in from sky from a side
  //   'dive'    — appears high above sandwich, drops straight down (fast!)
  //   'walking' — lands on parapet far from sandwich, walks toward it
  //   'fromLeft'/'fromRight' — force side for paired attacks
  function makeGull(opts) {
    opts = opts || {};
    const sandPt = srcToCanvas(SRC.sandwichCenter.x, SRC.sandwichCenter.y);
    let startX, startY, fromLeft;
    let spawnType = opts.type || 'normal';

    if (opts.startOverride) {
      startX = opts.startOverride.x;
      startY = opts.startOverride.y;
      fromLeft = startX < W / 2;
    } else if (spawnType === 'dive') {
      // Appear high directly above sandwich
      startX = sandPt.x + jit(30 * bgScale);
      startY = Math.max(20, srcToCanvas(0, 40).y);
      fromLeft = false; // doesn't matter, will dive straight
    } else if (spawnType === 'walking') {
      // Land on parapet, far from sandwich
      const onLeft = Math.random() < 0.5;
      const parapetTopY = srcToCanvas(0, SRC.parapetTop).y;
      startY = parapetTopY - 5 * bgScale; // slightly above parapet top
      if (onLeft) {
        // To the left of the boy — between left edge and boy
        startX = Math.max(40, srcToCanvas(80, 0).x);
        fromLeft = true;
      } else {
        // To the right of perched gull
        startX = Math.min(W - 40, srcToCanvas(1050, 0).x);
        fromLeft = false;
      }
    } else if (spawnType === 'fromLeft') {
      fromLeft = true;
      startX = -120;
      const skyTopCanvas = Math.max(20, srcToCanvas(0, 60).y);
      startY = skyTopCanvas + Math.random() * Math.max(100, sandPt.y - skyTopCanvas - 100);
    } else if (spawnType === 'fromRight') {
      fromLeft = false;
      startX = W + 120;
      const skyTopCanvas = Math.max(20, srcToCanvas(0, 60).y);
      startY = skyTopCanvas + Math.random() * Math.max(100, sandPt.y - skyTopCanvas - 100);
    } else {
      fromLeft = Math.random() < 0.5;
      startX = fromLeft ? -120 : W + 120;
      const skyTopCanvas = Math.max(20, srcToCanvas(0, 60).y);
      startY = skyTopCanvas + Math.random() * Math.max(100, sandPt.y - skyTopCanvas - 100);
    }

    const targetX = sandPt.x + jit(40 * bgScale);
    const targetY = sandPt.y - 35 * bgScale;
    const dx = targetX - startX;
    const dy = targetY - startY;
    const dist = Math.hypot(dx, dy);

    // Speed scales with difficulty/time
    let baseSpeed = 1.6 + state.timeAlive * 0.0004 + Math.random() * 0.7;
    if (spawnType === 'dive') baseSpeed = 4.5 + Math.random() * 1.5; // very fast
    if (spawnType === 'walking') baseSpeed = 1.2 + Math.random() * 0.4; // slower walk

    const speed = baseSpeed * Math.max(1, bgScale * 0.8);

    // For 'walking' state — set initial state to 'walking' instead of 'flying'
    let initState = 'flying';
    let vx, vy;
    if (spawnType === 'walking') {
      initState = 'walking';
      // walks horizontally toward sandwich along parapet
      vx = (targetX > startX ? 1 : -1) * speed * 0.6;
      vy = 0;
    } else {
      vx = (dx/dist) * speed;
      vy = (dy/dist) * speed;
    }

    // Facing: head should face toward direction of horizontal motion
    // Original sprite (gull) faces LEFT; gullFlipped faces RIGHT
    // facing=1 → use gull (faces left) → moving leftward
    // facing=-1 → use gullFlipped (faces right) → moving rightward
    let facing;
    if (vx > 0) facing = -1;  // moving right, need right-facing sprite
    else        facing =  1;  // moving left, need left-facing sprite

    return {
      x: startX, y: startY, tx: targetX, ty: targetY,
      vx, vy,
      state: initState, stateT: 0,
      spawnType,
      bob: Math.random() * Math.PI * 2,
      facing,
      sizeFactor: 0.85 + Math.random() * 0.3,
      rot: 0
    };
  }

  function updateGulls(dt) {
    for (let i = state.gulls.length - 1; i >= 0; i--) {
      const g = state.gulls[i];
      g.bob += 0.15;
      g.stateT += dt;
      if (g.state === 'flying') {
        g.x += g.vx * dt / 16;
        g.y += g.vy * dt / 16;
        if (Math.hypot(g.tx - g.x, g.ty - g.y) < 25 * bgScale) {
          g.state = 'pecking';
          g.stateT = 0; g.vx = 0; g.vy = 0;
          g.x = g.tx; g.y = g.ty;
          chompSound();
        }
      } else if (g.state === 'walking') {
        g.x += g.vx * dt / 16;
        // small bobbing while walking
        g.y = g.ty + Math.sin(g.bob * 2) * 1.5;
        if (Math.abs(g.tx - g.x) < 25 * bgScale) {
          g.state = 'pecking';
          g.stateT = 0; g.vx = 0; g.vy = 0;
          g.x = g.tx; g.y = g.ty;
          chompSound();
        }
      } else if (g.state === 'pecking') {
        if (g.stateT > 700) {
          state.lives--;
          state.shake = 16;
          state.flash = 1;
          state.biteProgress = 1;
          triggerBoyStartle();
          updateLivesUI();
          flashSandwichCrumbs();
          g.state = 'fleeing';
          g.stateT = 0;
          g.vx = (Math.random() < 0.5 ? -1 : 1) * 5;
          g.vy = -4.5;
          g.hasBread = true;
          if (state.lives <= 0) endGame();
        }
      } else if (g.state === 'scared') {
        g.x += g.vx * dt / 16;
        g.y += g.vy * dt / 16;
        g.vy += 0.05 * dt / 16;
        g.rot += 0.15;
        if (g.stateT > 1500 || g.x < -150 || g.x > W + 150 || g.y > H + 80) {
          state.gulls.splice(i, 1); continue;
        }
      } else if (g.state === 'fleeing') {
        g.x += g.vx * dt / 16;
        g.y += g.vy * dt / 16;
        g.vy += 0.025 * dt / 16;
        if (g.x < -150 || g.x > W + 150 || g.y > H + 80) {
          state.gulls.splice(i, 1); continue;
        }
      }
    }
  }

  function flashSandwichCrumbs() {
    const s = srcToCanvas(SRC.sandwichCenter.x, SRC.sandwichCenter.y);
    for (let i = 0; i < 12; i++) {
      state.crumbs.push({
        x: s.x + jit(35 * bgScale),
        y: s.y - 5 * bgScale,
        vx: jit(5),
        vy: -2 - Math.random() * 3,
        life: 900,
        size: 1.5 + Math.random() * 2
      });
    }
  }

  function drawGull(g) {
    const h = gullDisplaySize() * g.sizeFactor;
    const sprite = g.facing === -1 ? assets.gullFlipped : assets.gull;
    const aspect = sprite.width / sprite.height;
    const w = h * aspect;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot || 0);
    let bobY = 0;
    if (g.state === 'flying') bobY = Math.sin(g.bob) * 3;
    else if (g.state === 'pecking') bobY = Math.sin(g.stateT * 0.018) * 6;
    ctx.translate(0, bobY);
    let sy_scale = 1;
    if (g.state === 'flying') sy_scale = 1 + Math.sin(g.bob) * 0.04;
    ctx.scale(1, sy_scale);
    const prevComp = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'darken';
    ctx.drawImage(sprite, -w/2, -h/2, w, h);
    ctx.globalCompositeOperation = prevComp;
    if (g.hasBread) {
      const beakX = g.facing === -1 ? -w*0.3 : w*0.3;
      ctx.fillStyle = '#A88A4A';
      ctx.strokeStyle = 'rgba(28,28,32,0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(beakX, -h * 0.25, 6, 4, 0.3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ===== SANDWICH (4 styles, drawn programmatically, much smaller, muted palette) =====
  // Cache offscreen canvas — invalidate when style or lives or scale changes
  let sandwichCache = { lives: -1, scale: -1, style: -1, canvas: null };

  function buildSandwich(style, lives, scaleHint) {
    // Sized to be comparable to the boy in the original drawing
    // The boy in source is about 100px wide. We want the sandwich ~50-60px wide in source coords.
    const sizeFactor = lives === 3 ? 1.0 : lives === 2 ? 0.72 : 0.48;
    const baseW_src = 56 * sizeFactor;     // size in source-image px
    const baseH_src = 22 * sizeFactor;
    const baseW = baseW_src * scaleHint;
    const baseH = baseH_src * scaleHint;
    const padding = 18;

    const off = document.createElement('canvas');
    off.width = Math.ceil(baseW + padding * 2);
    off.height = Math.ceil(baseH + padding * 2);
    const oc = off.getContext('2d');
    const cx = off.width / 2;
    const cy = off.height / 2;

    function watercolorBlob(c, x, y, rx, ry, color, layers, baseAlpha) {
      for (let i = 0; i < layers; i++) {
        const f = 0.78 + Math.random() * 0.35;
        const ox = (Math.random()-0.5) * rx * 0.18;
        const oy = (Math.random()-0.5) * ry * 0.18;
        c.fillStyle = color;
        c.globalAlpha = baseAlpha * (1 - i * 0.08);
        c.beginPath();
        c.ellipse(x+ox, y+oy, rx*f, ry*f, (Math.random()-0.5)*0.2, 0, Math.PI*2);
        c.fill();
      }
      c.globalAlpha = 1;
    }
    function wobblyOval(c, x, y, w, h, color, lineW, segments, jitter, passes) {
      c.strokeStyle = color;
      c.lineWidth = lineW;
      c.lineCap = 'round';
      for (let p = 0; p < passes; p++) {
        c.beginPath();
        for (let i = 0; i <= segments; i++) {
          const a = (i/segments) * Math.PI*2;
          const r = 1 + (Math.random()-0.5) * jitter;
          const px = x + Math.cos(a) * (w/2) * r + (Math.random()-0.5)*0.7;
          const py = y + Math.sin(a) * (h/2) * r + (Math.random()-0.5)*0.7;
          if (i === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.stroke();
      }
    }

    // Muted ochre/dusty palette to match Lev's drawing
    const OCHRE_DARK = '#8C6F35';
    const OCHRE_MID  = '#A88656';
    const OCHRE_LIGHT= '#C4A672';
    const PENCIL = 'rgba(40, 35, 25, 0.85)';

    if (style === 1) {
      // Style 1: Pencil pirozhok — dusty ochre blob with thin pencil contour and 3 small dots
      watercolorBlob(oc, cx, cy, baseW/2, baseH/2, OCHRE_MID, 4, 0.45);
      watercolorBlob(oc, cx, cy-baseH*0.1, baseW/2.5, baseH/3, OCHRE_LIGHT, 2, 0.35);
      wobblyOval(oc, cx, cy, baseW, baseH, PENCIL, 0.9, 22, 0.07, 1);
      // 3 small dots on top
      oc.fillStyle = 'rgba(70, 50, 25, 0.85)';
      for (let i = 0; i < 3; i++) {
        const t = 0.3 + i * 0.2;
        const dx = -baseW/2 + t * baseW;
        const dy = -baseH * 0.2 + (Math.random()-0.5) * 2;
        oc.beginPath();
        oc.arc(cx + dx, cy + dy, Math.max(0.8, 1.2 * scaleHint * 0.5), 0, Math.PI*2);
        oc.fill();
      }
    } else if (style === 2) {
      // Style 2: Pure watercolor blob — no contour, multiple ochre tones
      watercolorBlob(oc, cx, cy, baseW/2, baseH/2, OCHRE_DARK, 5, 0.4);
      watercolorBlob(oc, cx-baseW*0.1, cy-baseH*0.1, baseW/2.3, baseH/2.5, OCHRE_MID, 4, 0.35);
      watercolorBlob(oc, cx+baseW*0.1, cy+baseH*0.1, baseW/3, baseH/3, OCHRE_LIGHT, 3, 0.4);
      // tiny shadow line at the bottom
      oc.strokeStyle = 'rgba(60, 45, 20, 0.4)';
      oc.lineWidth = 1.2;
      oc.beginPath();
      oc.moveTo(cx - baseW*0.35, cy + baseH*0.4);
      oc.quadraticCurveTo(cx, cy + baseH*0.5, cx + baseW*0.35, cy + baseH*0.4);
      oc.stroke();
    } else if (style === 3) {
      // Style 3: Cookie/bun — rounder, with crumb-dots scattered
      const r = baseW * 0.42;
      watercolorBlob(oc, cx, cy, r, r * 0.7, OCHRE_MID, 4, 0.5);
      watercolorBlob(oc, cx, cy-r*0.1, r*0.75, r*0.5, OCHRE_LIGHT, 2, 0.35);
      wobblyOval(oc, cx, cy, r*2, r*1.4, PENCIL, 0.9, 22, 0.06, 1);
      // 5 dots scattered like sesame
      oc.fillStyle = 'rgba(70, 50, 25, 0.85)';
      const dotPositions = [[-r*0.5, -r*0.2], [-r*0.15, -r*0.35], [r*0.2, -r*0.25],
                            [r*0.5, -r*0.05], [-r*0.3, r*0.1]];
      for (const [dx, dy] of dotPositions) {
        oc.beginPath();
        oc.arc(cx + dx, cy + dy, Math.max(0.9, 1.3 * scaleHint * 0.5), 0, Math.PI*2);
        oc.fill();
      }
    } else {
      // Style 4: Pencil oval — minimal fill, pencil hatching inside
      watercolorBlob(oc, cx, cy, baseW/2, baseH/2, OCHRE_LIGHT, 3, 0.25);
      // Thicker pencil contour, 2 passes
      wobblyOval(oc, cx, cy, baseW, baseH, PENCIL, 1.0, 24, 0.08, 2);
      // hatching lines inside
      oc.strokeStyle = 'rgba(60, 45, 25, 0.7)';
      oc.lineWidth = 0.7;
      const numHatch = 6;
      for (let i = 0; i < numHatch; i++) {
        const t = (i + 0.5) / numHatch;
        const px = cx - baseW*0.4 + t * baseW * 0.8;
        oc.beginPath();
        oc.moveTo(px + (Math.random()-0.5)*0.5, cy - baseH*0.18);
        oc.lineTo(px + 1.5 + (Math.random()-0.5)*0.5, cy + baseH*0.18);
        oc.stroke();
      }
    }

    // === BITES ===
    const numBites = 3 - lives;
    if (numBites > 0) {
      const biteSpecs = [];
      if (numBites >= 1) biteSpecs.push({ x: cx + baseW*0.4, y: cy + baseH*0.05, r: baseH*0.6 });
      if (numBites >= 2) biteSpecs.push({ x: cx - baseW*0.4, y: cy - baseH*0.05, r: baseH*0.6 });
      oc.globalCompositeOperation = 'destination-out';
      for (const b of biteSpecs) {
        oc.beginPath(); oc.arc(b.x, b.y, b.r, 0, Math.PI*2); oc.fill();
      }
      oc.globalCompositeOperation = 'source-over';
      // tooth marks
      oc.strokeStyle = 'rgba(40, 30, 20, 0.65)';
      oc.lineWidth = 0.9;
      oc.lineCap = 'round';
      for (const b of biteSpecs) {
        const baseAng = Math.atan2(b.y - cy, b.x - cx) + Math.PI;
        const teeth = 5;
        for (let j = 0; j < teeth; j++) {
          const a = baseAng + (j - (teeth-1)/2) * 0.32;
          const x1 = b.x + Math.cos(a) * (b.r - 1);
          const y1 = b.y + Math.sin(a) * (b.r - 1);
          const x2 = b.x + Math.cos(a) * (b.r + 3);
          const y2 = b.y + Math.sin(a) * (b.r + 3);
          oc.beginPath();
          oc.moveTo(x1, y1); oc.lineTo(x2, y2);
          oc.stroke();
        }
      }
    }

    return { canvas: off, w: baseW, h: baseH };
  }

  function drawSandwich() {
    if (state.lives <= 0) return;
    if (sandwichCache.lives !== state.lives ||
        sandwichCache.style !== state.sandwichStyle ||
        Math.abs(sandwichCache.scale - bgScale) > 0.01) {
      sandwichCache = Object.assign(
        { lives: state.lives, scale: bgScale, style: state.sandwichStyle },
        buildSandwich(state.sandwichStyle, state.lives, bgScale)
      );
    }
    const sc = sandwichCache;
    const center = srcToCanvas(SRC.sandwichCenter.x, SRC.sandwichCenter.y);

    ctx.save();
    ctx.translate(center.x, center.y);
    if (state.shake > 0) ctx.translate(jit(state.shake), jit(state.shake));
    if (state.biteProgress > 0) {
      const phase = (1 - state.biteProgress) * Math.PI;
      const sx = 1 + Math.sin(phase) * 0.18;
      const sy = 1 - Math.sin(phase) * 0.12;
      ctx.scale(sx, sy);
    }
    // Sit on parapet — bottom of sandwich at center.y
    ctx.drawImage(sc.canvas, -sc.canvas.width/2, -sc.canvas.height/2 - sc.h/2);
    ctx.restore();
  }

  // ===== MASK Lev's original sandwich and gull by copying neighbouring background =====
  // Used to "erase" what Lev drew so we can place our own sprites in its place
  // and reveal clean background when our sprite is removed/animated away.
  // Cached offscreen patches with feathered edges (built per-resize)
  const maskCache = new Map();
  function buildSoftPatch(area, donor, featherFrac) {
    const dw = Math.ceil(area.w * bgScale);
    const dh = Math.ceil(area.h * bgScale);
    if (dw < 2 || dh < 2) return null;
    const off = document.createElement('canvas');
    off.width = dw; off.height = dh;
    const oc = off.getContext('2d');
    // Draw the donor patch onto offscreen at canvas scale
    oc.drawImage(assets.bg, donor.x, donor.y, area.w, area.h, 0, 0, dw, dh);
    // Apply soft alpha gradient — fully opaque in center, fading at edges
    oc.globalCompositeOperation = 'destination-in';
    const f = featherFrac;
    const grad = oc.createRadialGradient(dw/2, dh/2, 0, dw/2, dh/2, Math.max(dw, dh) * 0.55);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1 - f, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    oc.fillStyle = grad;
    oc.fillRect(0, 0, dw, dh);
    return off;
  }

  function maskLevArea(area, donor, key, feather) {
    if (!assets.bg) return;
    let entry = maskCache.get(key);
    if (!entry || entry.scale !== bgScale) {
      const patch = buildSoftPatch(area, donor, feather || 0.18);
      entry = { patch, scale: bgScale };
      maskCache.set(key, entry);
    }
    if (!entry.patch) return;
    ctx.drawImage(
      entry.patch,
      area.x * bgScale + bgOffsetX,
      area.y * bgScale + bgOffsetY
    );
  }
  function maskLevSandwich() { maskLevArea(SRC.levSandwichArea, SRC.levSandwichDonor, 'sand', 0.10); }
  function maskLevGull()     { maskLevArea(SRC.levGullArea,     SRC.levGullDonor,     'gull', 0.18); }

  // ===== PERCHED GULL (our sprite drawn in the spot where we masked Lev's gull) =====
  // Initial state shows a copy that looks identical to Lev's, but we control it.
  let perchedGullState = { state: 'perched', t: 0, flutter: 0 };

  function updatePerched(dt) {
    const pg = perchedGullState;
    pg.t += dt;
    if (pg.state === 'perched') {
      pg.flutter = Math.max(0, pg.flutter - dt * 0.002);
      if (Math.random() < 0.005 && pg.flutter <= 0) pg.flutter = 1;
      // Take off after ~5 seconds
      if (pg.t > 5000) {
        pg.state = 'taking_off';
        pg.t = 0;
        gullCry();
      }
    } else if (pg.state === 'taking_off') {
      // Lift up gradually for 800ms, then become a regular flying gull
      if (pg.t > 800) {
        pg.state = 'launched';
        // Add as a flying gull, starting from the perch position
        const perch = srcToCanvas(SRC.gullPerchCenter.x, SRC.gullPerchCenter.y);
        const newGull = makeGull({ x: perch.x, y: perch.y - 15 * bgScale });
        const sandPt = srcToCanvas(SRC.sandwichCenter.x, SRC.sandwichCenter.y);
        const dx = sandPt.x - newGull.x;
        const dy = (sandPt.y - 35 * bgScale) - newGull.y;
        const dist = Math.hypot(dx, dy);
        const speed = 2.5 * Math.max(1, bgScale * 0.8);
        newGull.vx = (dx/dist) * speed;
        newGull.vy = (dy/dist) * speed;
        newGull.tx = sandPt.x;
        newGull.ty = sandPt.y - 35 * bgScale;
        newGull.facing = 1;  // flying LEFT toward sandwich, head-first
        state.gulls.push(newGull);
      }
    }
  }

  function drawPerchedGull() {
    const pg = perchedGullState;
    if (pg.state === 'launched') return;
    const center = srcToCanvas(SRC.gullPerchCenter.x, SRC.gullPerchCenter.y);
    const h = gullDisplaySize();
    const sprite = assets.gull; // original: head/beak face LEFT toward sandwich
    const aspect = sprite.width / sprite.height;
    const w = h * aspect;

    let extraY = 0;
    let scaleY = 1;
    if (pg.state === 'perched' && pg.flutter > 0) {
      scaleY = 1 + Math.sin(now * 0.04) * 0.08 * pg.flutter;
    }
    if (pg.state === 'taking_off') {
      extraY = -pg.t * 0.04 * bgScale; // gradual lift
      scaleY = 1 + Math.sin(now * 0.06) * 0.18;
    }

    ctx.save();
    ctx.translate(center.x, center.y + extraY);
    ctx.scale(1, scaleY);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'darken';
    ctx.drawImage(sprite, -w/2, -h/2, w, h);
    ctx.globalCompositeOperation = prev;
    ctx.restore();
  }

  function resetPerched() {
    perchedGullState = { state: 'perched', t: 0, flutter: 0 };
  }

  // ===== BOY HEAD (animated, vairant C: only the head moves) =====
  let boyHeadState = { startle: 0, nod: 0 };  // both 1.0 → 0.0 over time
  function triggerBoyStartle() { boyHeadState.startle = 1; }
  function triggerBoyNod() { boyHeadState.nod = 1; }

  function maskBoyHead() { maskLevArea(SRC.boyHeadArea, SRC.boyHeadDonor, 'boyHead', 0.35); }

  function drawBoyHead() {
    if (!assets.boyHead) return;
    const center = srcToCanvas(SRC.boyHeadCenter.x, SRC.boyHeadCenter.y);
    const sprite = assets.boyHead;
    // Sprite is 145×120 src pixels — render at natural src size
    const targetW = 145 * bgScale;
    const aspect = sprite.width / sprite.height;
    const w = targetW;
    const h = w / aspect;

    // Idle breathing + sway — bigger so it's actually visible
    const breath = 1 + Math.sin(now * 0.002) * 0.035;
    const sway = Math.sin(now * 0.0012) * 2.5;
    let extraRot = Math.sin(now * 0.0009) * 0.04;
    let extraY = Math.sin(now * 0.002) * 1.2;

    // Startle — sharp down-tilt + shake
    if (boyHeadState.startle > 0) {
      const s = boyHeadState.startle;
      extraRot += -0.35 * s * (1 - s * 0.5); // tilts down
      extraY += s * 10 * bgScale;
      extraY += Math.sin(now * 0.05) * s * 3;
    }
    // Nod — when chasing away a gull (proud gesture)
    if (boyHeadState.nod > 0) {
      const n = boyHeadState.nod;
      extraRot += 0.20 * Math.sin(n * Math.PI); // tilts up briefly
      extraY -= n * 4 * bgScale * Math.sin(n * Math.PI);
    }

    ctx.save();
    ctx.translate(center.x + sway, center.y + extraY);
    ctx.rotate(extraRot);
    ctx.scale(1, breath);

    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'darken';
    // dy = -h*0.85 → neck (85% from top) sits at rotate/translate origin
    ctx.drawImage(sprite, -w/2, -h * 0.85, w, h);
    ctx.globalCompositeOperation = prev;

    ctx.restore();
  }

  // ===== INTERACTION =====
  function gullHit(g, px, py) {
    const h = gullDisplaySize() * g.sizeFactor;
    const w = h * (assets.gull.width / assets.gull.height);
    const dx = px - g.x;
    const dy = py - g.y;
    return Math.abs(dx) < w * 0.5 && Math.abs(dy) < h * 0.5;
  }

  function handleTap(x, y) {
    if (!state.running) return;
    let hit = false;
    for (let i = state.gulls.length - 1; i >= 0; i--) {
      const g = state.gulls[i];
      if (g.state === 'scared' || g.state === 'fleeing') continue;
      if (gullHit(g, x, y)) {
        g.state = 'scared'; g.stateT = 0;
        const awayX = (g.x < W / 2) ? -1 : 1;
        g.vx = awayX * (5 + Math.random() * 3);
        g.vy = -7 - Math.random() * 3;
        g.facing = awayX === -1 ? 1 : -1;
        for (let f = 0; f < 8; f++) {
          state.feathers.push({
            x: g.x, y: g.y,
            vx: jit(5), vy: -1 + jit(2),
            life: 1300, rot: Math.random() * Math.PI, vr: jit(0.2)
          });
        }
        state.score++;
        scoreEl.textContent = state.score;
        triggerBoyNod();
        whooshSound(); gullCry();
        hit = true; break;
      }
    }
    if (!hit) {
      for (let f = 0; f < 4; f++) {
        state.feathers.push({
          x: x, y: y, vx: jit(2), vy: jit(2),
          life: 400, rot: 0, vr: 0, puff: true
        });
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    handleTap(e.clientX, e.clientY);
  });

  styleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.sandwichStyle = state.sandwichStyle % 4 + 1;
    styleNumEl.textContent = state.sandwichStyle;
    sandwichCache.lives = -1;
    updatePickerSelection();
  });

  // ===== PARTICLES =====
  function updateParticles(dt) {
    for (let i = state.feathers.length - 1; i >= 0; i--) {
      const f = state.feathers[i];
      f.x += f.vx; f.y += f.vy;
      f.vy += 0.1; f.vx *= 0.98;
      f.life -= dt; f.rot += f.vr;
      if (f.life <= 0) state.feathers.splice(i, 1);
    }
    for (let i = state.crumbs.length - 1; i >= 0; i--) {
      const c = state.crumbs[i];
      c.x += c.vx; c.y += c.vy;
      c.vy += 0.18;
      c.life -= dt;
      if (c.life <= 0) state.crumbs.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const f of state.feathers) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.min(1, f.life / 500);
      if (f.puff) {
        ctx.fillStyle = 'rgba(180,175,160,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#D8D5C7';
        ctx.strokeStyle = 'rgba(28,28,32,0.85)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.ellipse(0, 0, 6 * bgScale * 0.5, 2.5 * bgScale * 0.5, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
    for (const c of state.crumbs) {
      ctx.fillStyle = '#7A5A28';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size * Math.max(1, bgScale * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateLivesUI() {
    livesEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const div = document.createElement('div');
      div.className = 'heart' + (i >= state.lives ? ' lost' : '');
      div.innerHTML = `<svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="14" cy="16" rx="11" ry="6" fill="#A88656" stroke="#1A1A1D" stroke-width="1.4"/>
        <circle cx="9" cy="15" r="0.9" fill="#5A3A1A"/>
        <circle cx="13" cy="14.5" r="0.9" fill="#5A3A1A"/>
        <circle cx="17" cy="15.5" r="0.9" fill="#5A3A1A"/>
        <circle cx="20" cy="16" r="0.7" fill="#5A3A1A"/>
      </svg>`;
      livesEl.appendChild(div);
    }
  }

  // ===== PICKER on start screen =====
  function buildPicker() {
    pickerRow.innerHTML = '';
    for (let i = 1; i <= 4; i++) {
      const cell = document.createElement('div');
      cell.className = 'picker-cell' + (i === state.sandwichStyle ? ' selected' : '');
      cell.dataset.style = i;

      const previewCanvas = document.createElement('canvas');
      previewCanvas.width = 60 * 2; previewCanvas.height = 32 * 2; // for sharp DPR
      previewCanvas.style.width = '60px';
      previewCanvas.style.height = '32px';
      const pctx = previewCanvas.getContext('2d');
      pctx.scale(2, 2);
      // Build preview: full size sandwich
      const built = buildSandwich(i, 3, 0.85);
      pctx.drawImage(built.canvas, 30 - built.canvas.width/2, 16 - built.canvas.height/2);

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = '' + i;

      cell.appendChild(previewCanvas);
      cell.appendChild(num);
      cell.addEventListener('click', () => {
        state.sandwichStyle = i;
        styleNumEl.textContent = i;
        sandwichCache.lives = -1;
        updatePickerSelection();
      });
      pickerRow.appendChild(cell);
    }
  }
  function updatePickerSelection() {
    pickerRow.querySelectorAll('.picker-cell').forEach(c => {
      c.classList.toggle('selected', parseInt(c.dataset.style) === state.sandwichStyle);
    });
  }

  // ===== LOOP =====
  let lastT = 0;
  function loop(t) {
    now = t;
    const dt = Math.min(t - lastT, 50);
    lastT = t;

    if (state.running) {
      state.timeAlive += dt;

      updatePerched(dt);

      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        // Difficulty stages
        // Stage 0:  0–15s — single normal gulls
        // Stage 1: 15–30s — singles, occasional pair (left+right), some walkers
        // Stage 2: 30s+   — swarms of 3, occasional dive, walkers more often
        const t = state.timeAlive;
        if (t < 15000) {
          state.gulls.push(makeGull());
        } else if (t < 30000) {
          const r = Math.random();
          if (r < 0.20) {
            // pair attack: simultaneous left + right
            state.gulls.push(makeGull({ type: 'fromLeft' }));
            state.gulls.push(makeGull({ type: 'fromRight' }));
          } else if (r < 0.35) {
            state.gulls.push(makeGull({ type: 'walking' }));
          } else {
            state.gulls.push(makeGull());
          }
        } else {
          const r = Math.random();
          if (r < 0.18) {
            // swarm of 3
            state.gulls.push(makeGull({ type: 'fromLeft' }));
            state.gulls.push(makeGull({ type: 'fromRight' }));
            setTimeout(() => { if (state.running) state.gulls.push(makeGull()); }, 250);
          } else if (r < 0.30) {
            // dive bomb!
            state.gulls.push(makeGull({ type: 'dive' }));
          } else if (r < 0.45) {
            state.gulls.push(makeGull({ type: 'walking' }));
          } else if (r < 0.60) {
            state.gulls.push(makeGull({ type: 'fromLeft' }));
            state.gulls.push(makeGull({ type: 'fromRight' }));
          } else {
            state.gulls.push(makeGull());
          }
        }
        const factor = Math.max(0.45, 1 - state.timeAlive * 0.000035);
        state.spawnInterval = (1900 + Math.random() * 600) * factor;
        state.spawnTimer = state.spawnInterval;
      }
      updateGulls(dt);
      updateParticles(dt);
      if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 0.06);
      if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 0.003);
      if (state.biteProgress > 0) state.biteProgress = Math.max(0, state.biteProgress - dt * 0.003);
      if (boyHeadState.startle > 0) boyHeadState.startle = Math.max(0, boyHeadState.startle - dt * 0.0015);
      if (boyHeadState.nod > 0) boyHeadState.nod = Math.max(0, boyHeadState.nod - dt * 0.003);
    }

    ctx.save();
    if (state.shake > 0) ctx.translate(jit(state.shake), jit(state.shake));

    if (assets.bg) {
      ctx.drawImage(assets.bg, bgOffsetX, bgOffsetY, SRC_W * bgScale, SRC_H * bgScale);
    } else {
      ctx.fillStyle = '#ECE8DB';
      ctx.fillRect(0, 0, W, H);
    }

    // Always mask Lev's original sandwich, gull, and boy's head (cover them with
    // neighbouring bg patch) so our managed sprites can replace them and animate.
    maskLevSandwich();
    maskLevGull();
    maskBoyHead();

    // Animated boy head (rest of his body is still in the bg as Lev drew)
    drawBoyHead();

    // Our perched gull (sprite that looks identical to Lev's, but we control its takeoff)
    drawPerchedGull();

    // Our sandwich (stylized; appears on the bare parapet now that Lev's is masked)
    drawSandwich();

    // Flying / scared / fleeing gulls
    for (const g of state.gulls) {
      if (g.state !== 'pecking') drawGull(g);
    }
    for (const g of state.gulls) {
      if (g.state === 'pecking') drawGull(g);
    }

    drawParticles();

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,80,80,${state.flash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    requestAnimationFrame(loop);
  }

  function startGame() {
    state.running = true;
    state.score = 0; state.lives = 3;
    state.gulls = []; state.feathers = []; state.crumbs = [];
    state.timeAlive = 0;
    state.spawnTimer = 1500;
    state.spawnInterval = 2200;
    state.shake = 0; state.flash = 0; state.biteProgress = 0;
    resetPerched();
    boyHeadState = { startle: 0, nod: 0 };
    sandwichCache.lives = -1;
    scoreEl.textContent = '0';
    styleNumEl.textContent = state.sandwichStyle;
    updateLivesUI();
    hud.classList.remove('hidden');
    styleBtn.classList.remove('hidden');
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
  }

  function endGame() {
    state.running = false;
    if (state.score >= 15) {
      endTitle.textContent = 'Чайки в шоке!';
      endMsg.textContent = `Ты отогнал ${state.score} чаек.`;
    } else if (state.score >= 7) {
      endTitle.textContent = 'Неплохо для пирата';
      endMsg.textContent = `Отогнал ${state.score} наглых чаек.`;
    } else {
      endTitle.textContent = 'Чайки победили!';
      endMsg.textContent = `Они склевали бутерброд. Отогнал ${state.score}.`;
    }
    setTimeout(() => {
      hud.classList.add('hidden');
      styleBtn.classList.add('hidden');
      endScreen.classList.remove('hidden');
    }, 800);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    ensureAudio();
    startGame();
  });
  document.getElementById('restartBtn').addEventListener('click', () => startGame());

  (async () => {
    try {
      await loadAssets();
      resize();
      updateLivesUI();
      buildPicker();
      loadingEl.classList.add('hidden');
      startScreen.classList.remove('hidden');
      requestAnimationFrame(loop);
    } catch(e) {
      loadingEl.textContent = 'Не удалось загрузить рисунок: ' + e.message;
    }
  })();
})();
</script>
</body>
</html>

<body>
<div id="app" data-screen="home">
<header><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span class="brand-text">ЧИСТЫЕ<br>ИГРЫ</span></div><span class="edition">ПРОТОТИП / 02</span><div id="playHead"><span id="levelName"></span><button id="pauseBtn" class="iconbtn" aria-label="Пауза">Ⅱ</button></div></header>
<main id="stage">
<canvas id="world" aria-label="Игровая карта. Управление: касание карты, джойстик или стрелки. Пробел — собрать." tabindex="0"></canvas>
<section id="home"><div><div class="eyebrow">Игра между Чистыми Играми</div><h1>Чистый<br><span>маршрут.</span></h1><p class="hero-copy">Пройди по карте. Найди необычное.<br>Оставь после себя чистое место.</p></div><div><div class="home-card"><div class="home-kicker" id="homeKicker">ТВОЯ ПЕРВАЯ ВЫЛАЗКА</div><h2 id="homeTitle">01 / Парк у воды</h2><p class="home-meta" id="homeMeta">3 зоны · мешок находок · потерянный компас</p><button id="playBtn" class="primary">На маршрут <span>↗</span></button><div class="home-links"><button id="levelsBtn" class="secondary">⌘ Локации</button><button id="collectionBtn" class="secondary">◇ Коллекция</button></div></div><p class="footer-note">Прогулка без спешки. Рекорд — по желанию.</p></div></section>
<section id="hud" aria-label="Игровой интерфейс"><div id="quest"><div class="quest-kicker" id="questKicker">ЗАДАНИЕ КООРДИНАТОРА</div><div id="questText"></div><div id="questSub"></div><div class="progress"><div id="progressFill"></div></div></div><button id="miniBtn" aria-label="Открыть карту и задания"><canvas id="mini" width="130" height="182"></canvas><span>КАРТА ↗</span></button><div id="routeHint"></div><div id="toast" role="status" aria-live="polite"></div><div id="controls"><div id="stick" role="group" aria-label="Джойстик для движения"><div id="knob"></div></div><div id="middle"><button id="bagBtn"><small>МЕШОК</small><span id="bagCount">0 / 8</span></button><button id="baseBtn">↙ К базе</button></div><button id="action"><b aria-hidden="true">↓</b><span>Собрать</span></button></div></section>
<div id="veil"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Меню игры"></section></div>
<noscript>Для игры нужен JavaScript. Включите его в настройках браузера.</noscript>
</main></div>
